<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#iconGrad)"/>

  <!-- Inner top highlight -->
  <rect x="2" y="2" width="60" height="30" rx="15" fill="white" opacity="0.07"/>

  <!-- Bar 1 (shortest) -->
  <rect x="12" y="38" width="10" height="16" rx="3" fill="white" opacity="0.4"/>

  <!-- Bar 2 (medium) -->
  <rect x="26" y="28" width="10" height="26" rx="3" fill="white" opacity="0.7"/>

  <!-- Bar 3 (tallest) -->
  <rect x="40" y="17" width="10" height="37" rx="3" fill="white"/>

  <!-- 4-pointed star -->
  <path d="M45 8 L46.1 11.4 L49.5 11.4 L46.8 13.5 L47.8 17 L45 15 L42.2 17 L43.2 13.5 L40.5 11.4 L43.9 11.4 Z" fill="white" opacity="0.95" filter="url(#glow)"/>
</svg>
