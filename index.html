<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-content">
      <h1>TaskBoard</h1>
      <button class="btn-primary" id="addTaskBtn">+ New Task</button>
    </div>
  </header>

  <main class="board">

    <div class="column" id="col-todo">
      <div class="column-header todo">
        <span class="column-title">To Do</span>
        <span class="task-count" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </div>

    <div class="column" id="col-inprogress">
      <div class="column-header inprogress">
        <span class="column-title">In Progress</span>
        <span class="task-count" id="count-inprogress">0</span>
      </div>
      <div class="task-list" id="list-inprogress"></div>
    </div>

    <div class="column" id="col-done">
      <div class="column-header done">
        <span class="column-title">Done</span>
        <span class="task-count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </div>

  </main>

  <!-- Task Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Task</h2>
        <button class="btn-close" id="closeModal">&times;</button>
      </div>
      <form id="taskForm" novalidate>
        <div class="form-group">
          <label for="taskTitle">Title <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
        </div>
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" placeholder="Add more details (optional)" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDue">Due Date</label>
            <input type="date" id="taskDue">
          </div>
        </div>
        <div class="form-group">
          <label for="taskStatus">Status</label>
          <select id="taskStatus">
            <option value="todo">To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
