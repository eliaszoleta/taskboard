  <rect x="8" y="4" width="56" height="28" rx="14" fill="white" opacity="0.07"/>

  <rect x="17" y="38" width="10" height="14" rx="3" fill="white" opacity="0.4"/>
  <rect x="31" y="28" width="10" height="24" rx="3" fill="white" opacity="0.7"/>
  <rect x="45" y="17" width="10" height="35" rx="3" fill="white"/>
  <path d="M50 8 L51.1 11.4 L54.5 11.4 L51.8 13.5 L52.8 17 L50 15 L47.2 17 L48.2 13.5 L45.5 11.4 L48.9 11.4 Z" fill="white" opacity="0.95" filter="url(#glow)"/>

