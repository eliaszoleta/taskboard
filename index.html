<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <!-- ── User Selection Overlay ── -->
  <div class="user-overlay" id="userOverlay">
    <div class="user-card">
      <button class="user-overlay-close" id="userOverlayClose" title="Cancel" style="display:none">✕</button>
      <div class="user-card-logo">TaskBoard</div>
      <p class="user-card-sub">Who are you?</p>
      <div class="user-list" id="userList"></div>
      <div class="user-divider">or</div>
      <div class="user-new-row">
        <input type="text" id="newUserName" placeholder="Enter your name to join..." maxlength="30">
        <button class="btn-primary" id="joinBtn">Join</button>
      </div>
    </div>
  </div>

  <!-- ── Header ── -->
  <header>
    <div class="header-content">
      <h1>TaskBoard</h1>
      <div class="header-right">

        <!-- Notifications -->
        <div class="notif-wrapper">
          <button class="notif-btn" id="notifBtn" title="Notifications">
            <span class="notif-icon">🔔</span>
            <span class="notif-badge" id="notifBadge"></span>
          </button>
          <div class="notif-panel" id="notifPanel">
            <div class="notif-panel-header">
              <span>Notifications</span>
              <button class="btn-text" id="markAllRead">Mark all read</button>
            </div>
            <div class="notif-list" id="notifList"></div>
          </div>
        </div>

        <!-- Current user -->
        <div class="current-user">
          <span class="user-avatar" id="userAvatar"></span>
          <span class="user-name-display" id="userNameDisplay"></span>
          <button class="btn-text" id="changeUserBtn">Change</button>
        </div>

        <select class="date-filter" id="userFilter" title="Filter by user">
          <option value="all">👤 All users</option>
        </select>

        <select class="date-filter" id="dateFilter" title="Filter by date created">
          <option value="all">📅 All time</option>
          <option value="today">Today</option>
          <option value="this-week">This week</option>
          <option value="next-week">Next week</option>
          <option value="last-week">Last week</option>
          <option value="this-month">This month</option>
          <option value="overdue">⚠️ Overdue</option>
          <option value="custom">📆 Pick dates…</option>
        </select>

        <button class="btn-primary" id="addTaskBtn">+ New Task</button>
      </div>
    </div>
  </header>

  <!-- ── Custom Date Row ── -->
  <div class="custom-date-row" id="customDateRow" style="display:none">
    <label>From <input type="date" id="customFrom"></label>
    <label>To <input type="date" id="customTo"></label>
    <button class="btn-text" id="customDateApply">Apply</button>
  </div>

  <!-- ── Filter Bar ── -->
  <div class="filter-bar" id="filterBar">
    <span id="filterBarLabel"></span>
    <button class="filter-bar-clear" id="filterBarClear">Clear filter</button>
  </div>

  <!-- ── Board Wrapper ── -->
  <div class="board-wrapper">

    <!-- Activity Sidebar -->
    <aside class="notif-sidebar">
      <div class="notif-sidebar-header">My Activity</div>
      <div class="notif-sidebar-body" id="notifSidebarBody">
        <div class="sidebar-empty">Loading…</div>
      </div>
    </aside>

    <!-- ── Board ── -->
    <main class="board">

      <div class="column" id="col-todo">
      <div class="column-header todo">
        <span class="column-title">To Do</span>
        <span class="task-count" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo"></div>
    </div>

    <div class="column" id="col-inprogress">
      <div class="column-header inprogress">
        <span class="column-title">In Progress</span>
        <span class="task-count" id="count-inprogress">0</span>
      </div>
      <div class="task-list" id="list-inprogress"></div>
    </div>

    <div class="column" id="col-done">
      <div class="column-header done">
        <span class="column-title">Done</span>
        <span class="task-count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done"></div>
    </div>

    <div class="column" id="col-overdue">
      <div class="column-header overdue">
        <span class="column-title">Overdue</span>
        <span class="task-count" id="count-overdue">0</span>
      </div>
      <div class="task-list" id="list-overdue"></div>
    </div>

    </main><!-- /.board -->

  </div><!-- /.board-wrapper -->

  <!-- ── Task Create / Edit Modal ── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">New Task</h2>
        <button class="btn-close" id="closeModal">&times;</button>
      </div>
      <form id="taskForm" novalidate>
        <div class="form-group">
          <label for="taskTitle">Title <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="What needs to be done?" required>
        </div>
        <div class="form-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" placeholder="Add more details (optional)" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDue">Due Date</label>
            <input type="date" id="taskDue">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="taskStatus">Status</label>
            <select id="taskStatus">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskAssignee">Assign To</label>
            <select id="taskAssignee">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Task Detail + Comments Modal ── -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h2 id="detailTitle"></h2>
        <div class="detail-header-actions">
          <button class="btn-secondary btn-sm" id="detailEditBtn">✏️ Edit</button>
          <button class="btn-close" id="closeDetail">&times;</button>
        </div>
      </div>
      <div id="detailBody"></div>
      <div class="comments-section">
        <h3 class="comments-heading">Comments</h3>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-input-row">
          <input type="text" id="commentInput" placeholder="Write a comment...">
          <button class="btn-primary" id="postCommentBtn">Post</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
