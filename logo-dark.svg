  <text x="80" y="52" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6b7280" letter-spacing="0.4">Track. Compete. Achieve.</text>
